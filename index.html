      <div dir="rtl" lang="he" style="max-width:52rem;margin:0 auto;padding:2rem;font-family:Heebo,system-ui,sans-serif;line-height:1.7">
        <h1>Celox AI — שליטה מלאה על כל הצי שלך</h1>
        <p>כל מה שאתה צריך לנהל רכבים, נהגים, עלויות ומסמכים — במקום אחד. מהרכב הראשון ועד ציים גדולים.</p>

        <h2>איך זה עובד</h2>
        <ol>
          <li><strong>מוסיפים צי</strong> — רכבים, נהגים וסניפים, כולל ייבוא מאקסל בקליק אחד.</li>
          <li><strong>עוקבים ומקבלים התראות</strong> — טסטים, ביטוחים, רישיונות וטיפולים, הכל לפני שפג התוקף.</li>
          <li><strong>מקבלים תובנות</strong> — עלויות, דוחות ותקציב, והחלטות על בסיס נתונים.</li>
        </ol>

        <h2>מה המערכת כוללת</h2>
        <ul>
          <li><strong>ניהול רכבים</strong> — הוספה, עדכון ומחיקה של רכבים, עם מעקב מצב וסטטוס בזמן אמת.</li>
          <li><strong>ניהול נהגים</strong> — פרופילי נהגים מלאים, מעקב רישיונות ושיוך לרכבים.</li>
          <li><strong>ניהול עלויות</strong> — מעקב אחר כל ההוצאות עם קטגוריות ותקציב חודשי.</li>
          <li><strong>מסמכים בענן</strong> — ביטוחים, רישיונות ומסמכים נגישים מכל מכשיר.</li>
          <li><strong>תחזוקה מתוזמנת</strong> — תזמון ומעקב אחר טיפולים מונעים לכל הצי.</li>
          <li><strong>דוחות וניתוח</strong> — דוחות מפורטים של עלויות, תקציב ותחזוקה לכל רכב ולכל הצי.</li>
        </ul>

        <h2>למי זה מיועד</h2>
        <p>מנהלי צי רכב וקציני בטיחות בתעבורה בחברות המפעילות ציי רכב בישראל.</p>
