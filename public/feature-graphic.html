<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"/>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1024px; height: 500px; overflow: hidden; background: #0f172a; font-family: Arial, sans-serif; position: relative; }

  .bg {
    position: absolute; inset: 0;
    background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 100%);
  }

  .circle1 { position: absolute; width: 600px; height: 600px; border-radius: 50%; background: rgba(37,99,235,0.08); right: -100px; top: -100px; }
  .circle2 { position: absolute; width: 400px; height: 400px; border-radius: 50%; background: rgba(37,99,235,0.06); right: 0px; top: 50px; }

  .grid line { stroke: rgba(255,255,255,0.03); }

  .logo {
    position: absolute; left: 60px; top: 100px;
    width: 72px; height: 72px; border-radius: 18px;
    background: #2563eb;
    display: flex; align-items: center; justify-content: center;
    font-size: 36px; font-weight: bold; color: white;
  }

  .title { position: absolute; left: 60px; top: 195px; font-size: 52px; font-weight: bold; color: #f8fafc; }
  .subtitle { position: absolute; left: 60px; top: 258px; font-size: 28px; color: #94a3b8; font-weight: 400; }
  .tagline { position: absolute; left: 60px; top: 315px; font-size: 17px; color: #64748b; }
  .bar { position: absolute; left: 60px; top: 348px; width: 60px; height: 4px; border-radius: 2px; background: #2563eb; }

  .cards { position: absolute; right: 60px; top: 80px; display: grid; grid-template-columns: 1fr 1fr; gap: 16px; width: 360px; }
  .card {
    background: linear-gradient(135deg, #1e293b, #0f172a);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px; padding: 18px; text-align: center;
  }
  .card-value { font-size: 32px; font-weight: bold; color: #f8fafc; }
  .card-value.blue { color: #2563eb; }
  .card-value.green { color: #10b981; }
  .card-value.amber { color: #f59e0b; }
  .card-label { font-size: 13px; color: #64748b; margin-top: 4px; }

  .alert-card {
    position: absolute; right: 60px; bottom: 60px; width: 360px;
    background: linear-gradient(135deg, #1e293b, #0f172a);
    border: 1px solid rgba(37,99,235,0.3);
    border-radius: 12px; padding: 18px 18px 18px 24px;
    display: flex; align-items: center; gap: 16px;
  }
  .alert-bar { width: 4px; height: 44px; border-radius: 4px; background: #2563eb; flex-shrink: 0; }
  .alert-title { font-size: 14px; font-weight: 600; color: #f8fafc; }
  .alert-sub { font-size: 12px; color: #64748b; margin-top: 4px; }
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="circle1"></div>
  <div class="circle2"></div>

  <div class="logo">C</div>
  <div class="title">Celox AI</div>
  <div class="subtitle">Fleet Manager</div>
  <div class="tagline">Smart AI-powered fleet management for businesses</div>
  <div class="bar"></div>

  <div class="cards">
    <div class="card">
      <div class="card-value">247</div>
      <div class="card-label">Vehicles</div>
    </div>
    <div class="card">
      <div class="card-value blue">98%</div>
      <div class="card-label">Fleet Active</div>
    </div>
    <div class="card">
      <div class="card-value green">84</div>
      <div class="card-label">Drivers</div>
    </div>
    <div class="card">
      <div class="card-value amber">₪12K</div>
      <div class="card-label">Monthly Cost</div>
    </div>
  </div>

  <div class="alert-card">
    <div class="alert-bar"></div>
    <div>
      <div class="alert-title">Inspection Alert</div>
      <div class="alert-sub">3 vehicles due this week</div>
    </div>
  </div>
</body>
</html>
