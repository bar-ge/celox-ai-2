name: Build Android TWA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Gradle 8.4
        run: |
          curl -sL https://services.gradle.org/distributions/gradle-8.4-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.4/bin" >> $GITHUB_PATH

      - name: Accept Android SDK licenses & install components
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Install ImageMagick
        run: sudo apt-get install -y imagemagick

      - name: Generate app icons
        run: |
          mkdir -p android/app/src/main/res/{mipmap-mdpi,mipmap-hdpi,mipmap-xhdpi,mipmap-xxhdpi,mipmap-xxxhdpi}
          for spec in "mdpi:48" "hdpi:72" "xhdpi:96" "xxhdpi:144" "xxxhdpi:192"; do
            dir="${spec%:*}"
            size="${spec#*:}"
            convert public/icon-512.png -resize "${size}x${size}" \
              "android/app/src/main/res/mipmap-${dir}/ic_launcher.png"
            cp "android/app/src/main/res/mipmap-${dir}/ic_launcher.png" \
               "android/app/src/main/res/mipmap-${dir}/ic_launcher_round.png"
          done

      - name: Generate signing keystore
        run: |
          keytool -genkeypair \
            -keystore android/upload.keystore \
            -alias celoxai \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass CeloxAI2024! \
            -keypass CeloxAI2024! \
            -dname "CN=Celox AI, O=Celox AI, C=IL" \
            -noprompt

          echo ""
          echo "============================================"
          echo "SHA-256 FINGERPRINT — copy this for assetlinks.json:"
          keytool -list -v \
            -keystore android/upload.keystore \
            -alias celoxai \
            -storepass CeloxAI2024! \
            | grep "SHA256:"
          echo "============================================"

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Generate Gradle wrapper
        working-directory: android
        run: gradle wrapper --gradle-version 8.4 --distribution-type bin

      - name: Build release AAB
        working-directory: android
        env:
          KEYSTORE_PASSWORD: CeloxAI2024!
          KEY_PASSWORD: CeloxAI2024!
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: celoxai-android-release
          retention-days: 30
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/upload.keystore
